<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 880" font-family="'Open Sans', system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrowWhite" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#ffffff"/>
    </marker>
    <marker id="arrowDark" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#141414"/>
    </marker>
    <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#9ca3af"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1320" height="880" fill="#000000"/>

  <!-- ============ TITLE ============ -->
  <text x="56" y="56" fill="#ffffff" font-size="31" font-weight="700" letter-spacing="-0.4">Harnesses all the way down</text>
  <text x="56" y="86" fill="#9ca3af" font-size="16">A meta-harness steers GitHub Copilot to build a domain harness that steers an LLM —</text>
  <text x="56" y="108" fill="#9ca3af" font-size="16">not vibe-coding an algorithmic app where the AI is only your coding assistant.</text>

  <!-- vertical divider between the two worlds -->
  <line x1="862" y1="140" x2="862" y2="724" stroke="#3f3f46" stroke-width="1.5" stroke-dasharray="3 6"/>
  <circle cx="862" cy="432" r="21" fill="#000000" stroke="#737373" stroke-width="1.5"/>
  <text x="862" y="438" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle">vs</text>

  <!-- ===================================================================
       LEFT — RELATIONAL NESTING (harnesses building harnesses)
       =================================================================== -->

  <!-- Outer: META-HARNESS -->
  <rect x="56" y="140" width="784" height="582" rx="16" fill="#121212" stroke="#737373" stroke-width="1.5"/>
  <text x="80" y="170" fill="#9ca3af" font-size="12" font-weight="700" letter-spacing="1.6">META-HARNESS · THE WORKSHOP CODEBASE</text>
  <text x="80" y="195" fill="#ffffff" font-size="19" font-weight="700">Guides you with slash commands &amp; skills</text>
  <text x="80" y="216" fill="#9ca3af" font-size="14">A harness whose job is to help you build a harness</text>

  <!-- Middle: BASE AI HARNESS (Copilot) -->
  <rect x="92" y="232" width="712" height="474" rx="14" fill="#1e1e1e" stroke="#8a8f98" stroke-width="1.5"/>
  <text x="116" y="262" fill="#9ca3af" font-size="12" font-weight="700" letter-spacing="1.6">BASE AI HARNESS</text>
  <text x="116" y="287" fill="#ffffff" font-size="19" font-weight="700">GitHub Copilot — VS Code extension</text>
  <text x="116" y="308" fill="#9ca3af" font-size="14">Wraps the model · gives you an agent inside your editor</text>

  <!-- Inner: DOMAIN APP HARNESS (the deliverable) -->
  <rect x="128" y="324" width="640" height="364" rx="12" fill="#d8d8d8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="152" y="354" fill="#52525b" font-size="12" font-weight="700" letter-spacing="1.6">DOMAIN APP HARNESS · WHAT YOU SHIP</text>
  <text x="152" y="379" fill="#141414" font-size="19" font-weight="700">persona · rules · tools · hooks · MCP · evals</text>
  <text x="152" y="400" fill="#3f3f46" font-size="14">The AI-based app — built by the harness above</text>

  <!-- steers arrow down to the LLM -->
  <line x1="448" y1="430" x2="448" y2="556" stroke="#141414" stroke-width="2.5" marker-end="url(#arrowDark)"/>
  <text x="460" y="498" fill="#141414" font-size="14" font-weight="700">steers</text>

  <!-- LLM core -->
  <rect x="300" y="560" width="296" height="104" rx="14" fill="#ffffff" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="448" y="606" fill="#141414" font-size="26" font-weight="700" text-anchor="middle">LLM</text>
  <text x="448" y="632" fill="#52525b" font-size="13" text-anchor="middle">non-deterministic core</text>
  <text x="448" y="650" fill="#52525b" font-size="13" text-anchor="middle">the harness shapes what it outputs</text>

  <!-- "builds" relation between layers (right gutter) -->
  <text x="792" y="300" fill="#9ca3af" font-size="13" font-weight="700" text-anchor="end" transform="rotate(90 792 300)">builds ▸</text>

  <!-- ===================================================================
       SEQUENTIAL BUILD PIPELINE (driven by the meta-harness)
       =================================================================== -->
  <text x="56" y="760" fill="#9ca3af" font-size="13" font-weight="700" letter-spacing="0.4">SEQUENTIAL BUILD — driven by the meta-harness's slash commands</text>

  <g font-family="'SF Mono', ui-monospace, Menlo, monospace">
    <rect x="56" y="776" width="180" height="46" rx="9" fill="#1e1e1e" stroke="#6b7280" stroke-width="1.5"/>
    <text x="146" y="804" fill="#e5e7eb" font-size="15" text-anchor="middle">/plan-app</text>

    <line x1="244" y1="799" x2="276" y2="799" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>

    <rect x="284" y="776" width="240" height="46" rx="9" fill="#1e1e1e" stroke="#6b7280" stroke-width="1.5"/>
    <text x="404" y="804" fill="#e5e7eb" font-size="15" text-anchor="middle">/bootstrap-harness</text>

    <line x1="532" y1="799" x2="564" y2="799" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>

    <rect x="572" y="776" width="200" height="46" rx="9" fill="#1e1e1e" stroke="#6b7280" stroke-width="1.5"/>
    <text x="672" y="804" fill="#e5e7eb" font-size="15" text-anchor="middle">/test-harness</text>
  </g>

  <!-- ===================================================================
       RIGHT — THE DISTINCTION: VIBE CODING (no LLM in the product)
       =================================================================== -->
  <text x="892" y="170" fill="#9ca3af" font-size="12" font-weight="700" letter-spacing="1.6">FOR CONTRAST</text>
  <text x="892" y="195" fill="#ffffff" font-size="19" font-weight="700">Vibe coding</text>
  <text x="892" y="216" fill="#9ca3af" font-size="14">AI is your coding assistant — not the product</text>

  <rect x="892" y="240" width="372" height="84" rx="12" fill="#1e1e1e" stroke="#4b5563" stroke-width="1.5"/>
  <text x="912" y="272" fill="#e5e7eb" font-size="17" font-weight="700">AI coding assistant</text>
  <text x="912" y="296" fill="#9ca3af" font-size="13.5">writes code for you while you build</text>

  <line x1="1078" y1="328" x2="1078" y2="362" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="892" y="368" width="372" height="84" rx="12" fill="#1e1e1e" stroke="#4b5563" stroke-width="1.5"/>
  <text x="912" y="400" fill="#e5e7eb" font-size="17" font-weight="700">Algorithmic app</text>
  <text x="912" y="424" fill="#9ca3af" font-size="13.5">deterministic logic — the code you ship</text>

  <line x1="1078" y1="456" x2="1078" y2="490" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrowGray)"/>

  <rect x="892" y="496" width="372" height="98" rx="12" fill="#121212" stroke="#4b5563" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1078" y="534" fill="#ffffff" font-size="19" font-weight="700" text-anchor="middle">No LLM at runtime</text>
  <text x="1078" y="560" fill="#9ca3af" font-size="13.5" text-anchor="middle">the app just runs code; the model</text>
  <text x="1078" y="578" fill="#9ca3af" font-size="13.5" text-anchor="middle">never ships inside the product</text>

  <text x="892" y="636" fill="#6b7280" font-size="13">A harness ships <tspan fill="#cbd5e1" font-weight="700">around</tspan> an LLM and steers its output.</text>
  <text x="892" y="656" fill="#6b7280" font-size="13">Vibe coding uses an LLM to <tspan fill="#cbd5e1" font-weight="700">write</tspan> a product that has none.</text>

  <!-- ============ LEGEND ============ -->
  <g transform="translate(56 846)">
    <rect x="0" y="-13" width="20" height="20" rx="5" fill="none" stroke="#737373" stroke-width="1.5"/>
    <rect x="5" y="-8" width="10" height="10" rx="2.5" fill="none" stroke="#737373" stroke-width="1.5"/>
    <text x="30" y="2" fill="#9ca3af" font-size="13.5"><tspan fill="#ffffff" font-weight="700">Nested</tspan> = relational (wraps / contains)</text>

    <line x1="372" y1="-3" x2="402" y2="-3" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowWhite)"/>
    <text x="414" y="2" fill="#9ca3af" font-size="13.5"><tspan fill="#ffffff" font-weight="700">Arrow</tspan> = sequential (build &amp; run order)</text>
  </g>
</svg>
